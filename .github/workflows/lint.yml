name: lint

on:
  push:
    branches: [exploration]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v5

      - run: npm ci

      # ESLint, Stylelint, html-validate, Prettier, TypeScript, knip
      - run: just lint

      # shell scripts, the Python helper, Markdown and the workflow files
      - run: just lint-shell
      - run: just lint-py
      - run: just lint-md
      - run: just lint-actions
