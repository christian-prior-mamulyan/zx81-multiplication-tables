name: pages

on:
  push:
    branches: [exploration]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZX81_PY: python3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: extractions/setup-just@v2

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - run: just test
      - run: just test-browser

      # the site is assembled by tools/build-site.sh (BASIC -> .P -> hex tapes, emulator, pages)
      - run: just build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
