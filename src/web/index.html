<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZX81 Multiplication Trainer</title>
  <link rel="stylesheet" href="./web/app.css">
</head>
<body>
  <main>
    <h1>ZX81 Multiplication Trainer</h1>
    <div id="zx81-screen" aria-label="ZX81 screen"></div>
    <p id="zx81-status" role="status"></p>
    <p class="hint">A real ZX81 BASIC program running in an emulated ZX81. Click the screen, type a pause from 1 to 9 and press Enter.</p>
    <aside id="zx81-debug" hidden></aside>
  </main>
  <script type="module" src="./web/app.js"></script>
</body>
</html>
